name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        if: hashFiles('yarn.lock') != ''
        with:
          node-version-file: .node-version
          cache: "yarn"

      - name: Install packages
        run: |
          yarn install --frozen-lockfile

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint Ruby for consistent style
        run: bin/rake lint:rubocop
      - name: Lint ERB for consistent style
        run: bin/rake lint:herb
      - name: Lint Sass and Yaml for consistent style
        run: bin/rake lint:prettier
      - name: Lint Javascript and JSON for consistent style
        run: bin/rake lint:biome

  spec-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Every spec is in exactly one bucket
        run: bin/ci-specs --check

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby and Node
        uses: ./.github/actions/setup-app

      - name: JavaScript unit tests
        run: yarn test

  rspec:
    name: rspec (${{ matrix.bucket }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        bucket: [units, requests, system, engines]

    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby and Node
        uses: ./.github/actions/setup-app

      - name: Create and load the database
        run: bin/rails db:create db:schema:load

      - name: Precompile assets
        run: bin/rails assets:precompile

      # RSpec::Github::Formatter adds inline PR annotations on failures; .rspec
      # keeps the documentation formatter for readable logs.
      - name: Run specs (${{ matrix.bucket }})
        run: |
          files="$(bin/ci-specs "${{ matrix.bucket }}")"
          bundle exec rspec --format RSpec::Github::Formatter $files

      - name: Upload Capybara failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capybara-screenshots-${{ matrix.bucket }}
          path: tmp/capybara/
          if-no-files-found: ignore

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ./.github/actions/setup-app
        with:
          node: "false"
      - name: Create and load the database
        run: bin/rails db:create db:schema:load

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ./.github/actions/setup-app
        with:
          node: "false"

      # Build the database by running every migration against an empty database,
      # rather than loading schema.rb. This proves the migrations themselves apply
      # cleanly end to end before we ever deploy to staging/production.
      - name: Migrate from an empty database
        run: bin/rails db:create db:migrate

      # A clean migration run must reproduce the committed schema.rb exactly.
      # Any diff means a migration is out of sync with the checked-in schema.
      - name: Fail on schema drift
        run: git diff --exit-code db/schema.rb

  eager-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ./.github/actions/setup-app
        with:
          node: "false"

      - name: Eager-load check
        run: bin/rails zeitwerk:check
